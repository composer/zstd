# unstable on the pinned stable toolchain, the build scripts set RUSTC_BOOTSTRAP=1
cargo-features = ["panic-immediate-abort"]

[package]
name = "zstd-extract"
version = "1.1.0"
edition = "2021"
license = "MIT"
publish = false
build = "build.rs"

[dependencies]
# the zstd decoder, without unsafe code (its simd feature would bring in a crate with some, for no measurable gain
# here). Pinned exactly and vendored, as the Linux build runs offline: review the changes when updating with
# `RUSTC_BOOTSTRAP=1 cargo vendor vendor`
zrip-decode = { version = "=0.8.22", default-features = false, features = ["std"] }

[patch.crates-io]
zrip-core = { path = "vendor/zrip-core" }
zrip-decode = { path = "vendor/zrip-decode" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# panics abort without a message, which drops std's backtrace printing from the binary (over half its size);
# needs std rebuilt with it, see .cargo/config.toml
panic = "immediate-abort"
strip = true
