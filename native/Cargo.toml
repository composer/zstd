[package]
name = "zstd-extract"
version = "1.1.0"
edition = "2021"
license = "MIT"
publish = false
build = "build.rs"

# no dependencies: the decoder is the vendored zstd/ (see build.rs), everything else is std

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
